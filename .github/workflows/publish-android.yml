name: Publicar APK Android
on:
  push:
    paths:
      - '.release-payload/release.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter arquivos de distribuição
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Montar e verificar APK
        run: python3 .release-payload/assemble.py
      - name: Publicar release com APK e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create v0.1.3 dist/mina-profunda-v0.1.3-teste.apk dist/update.json --draft --target "$COMMIT_SHA" --title "Mina Profunda 0.1.3 — teste" --notes-file dist/release-notes.md
          gh release edit v0.1.3 --draft=false --latest
